<meta name="description" content="Spin to land on a random piece from 5AINT MONARCH. This website is for viewing only and is not a store.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: black gallery site. Slim top bar with wordmark and lowercase serif nav, oversized light serif headline, tracked small text, thin rules. */
:root{
  --bg:#0a0a0a;
  --bar:#050505;
  --panel:#101010;
  --fg:#f3f1ec;
  --muted:#aaa69e;
  --dim:#6f6c66;
  --line:#272522;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr,80px) + 70px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 18px/1.6 var(--serif);
  background-image:radial-gradient(ellipse 80% 50% at 70% 0%,#1b1b1a 0%,rgba(10,10,10,0) 70%);background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}
.wrap{max-width:1320px;margin:0 auto}

header{position:sticky;top:0;z-index:20;background:var(--bar);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:80px}
.logo{font:600 30px/1 var(--serif);letter-spacing:.01em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.logo i{font-style:normal;font-size:38px}
.logo{display:inline-flex;align-items:center;gap:14px}
.logo img{height:38px;width:auto;display:block}
@media (max-width:760px){.logo img{height:30px}}
nav{display:flex;gap:38px;align-items:center}
nav a{font-size:20px;text-decoration:none;color:#e6e2d9;padding-block:6px;border-bottom:1px solid transparent;text-transform:lowercase}
nav a:hover{border-bottom-color:var(--dim)}
nav a[aria-current="page"]{border-bottom-color:var(--fg)}

.hero{position:relative;display:grid;grid-template-columns:1fr minmax(240px,340px);gap:40px;align-items:start;padding-block:64px 44px;overflow:hidden}
.crown{position:absolute;right:6%;top:-6px;width:min(46vw,520px);height:auto;opacity:.16;pointer-events:none}
.hero > div{position:relative;min-width:0}
h1{font:300 clamp(60px,9vw,128px)/.92 var(--serif);text-transform:uppercase;margin:0;letter-spacing:.005em;text-wrap:balance}
.tag{margin:18px 0 0 6px;font-size:19px;letter-spacing:.55em;color:var(--muted);text-transform:lowercase}
.lede{margin:14px 0 0;font-size:17px;line-height:1.55;letter-spacing:.14em;color:var(--muted);text-transform:lowercase}
.rule{display:block;width:76px;border-top:1px solid var(--muted);margin-top:26px}

.filters{position:sticky;top:var(--hdr,80px);z-index:10;background:var(--bg);display:flex;gap:36px;padding:16px 0 14px;margin-bottom:36px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;font-size:18px;letter-spacing:.2em;color:var(--dim);text-transform:lowercase;white-space:nowrap}
.f sup{font-size:13px;margin-left:7px;letter-spacing:.04em;vertical-align:top;position:relative;top:-2px}
.f:hover{color:var(--fg)}
.f[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.gh{font:300 clamp(30px,3.6vw,44px)/1 var(--serif);text-transform:lowercase;letter-spacing:.16em;margin:0 0 22px;display:flex;align-items:baseline;gap:14px}
.gh span{font-size:16px;color:var(--dim);letter-spacing:.08em}
.grp + .grp{margin-top:72px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 22px}
.card{min-width:0}
.tile{display:block;width:100%;padding:0;border:1px solid #1d1c1a;background:#111;aspect-ratio:8/9;overflow:hidden;position:relative}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);transition:transform .5s ease}
.tile:hover img{transform:scale(1.06)}
.tile::after{content:"view";position:absolute;left:0;right:0;bottom:0;padding:26px 0 12px;text-align:center;font-size:16px;letter-spacing:.4em;text-transform:lowercase;background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transition:opacity .25s}
.tile:hover::after,.tile:focus-visible::after{opacity:1}
.cap{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-top:12px}
.cap h3{margin:0;font:500 21px/1.2 var(--serif);letter-spacing:.12em;text-transform:uppercase;overflow-wrap:anywhere}
.cap .p{color:var(--muted);font-size:20px;font-variant-numeric:lining-nums tabular-nums}
.note{margin:2px 0 0;color:var(--dim);font-size:16px;font-style:italic;letter-spacing:.04em}

section{padding-block:72px;border-top:1px solid var(--line)}
h2{font:300 clamp(40px,6vw,76px)/1 var(--serif);text-transform:uppercase;margin:0 0 28px;letter-spacing:.01em;text-wrap:balance}
h3.k{font:500 15px/1 var(--serif);letter-spacing:.4em;text-transform:lowercase;color:var(--muted);margin:0 0 16px}

footer{border-top:1px solid var(--line);margin-top:40px;padding-block:28px 44px;color:var(--dim);font-size:16px;letter-spacing:.12em;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;text-transform:lowercase}
footer a{text-decoration:none;border-bottom:1px solid var(--dim)}
footer a:hover{color:var(--fg);border-color:var(--fg)}

@media (max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:0;min-height:0;padding-top:14px}
  .logo{font-size:26px}
  nav{order:3;width:100%;gap:26px;overflow-x:auto;padding-block:8px 6px;margin-top:6px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{font-size:18px;white-space:nowrap}
  .hero{grid-template-columns:minmax(0,1fr);gap:24px;padding-block:40px 28px}
  h1{font-size:clamp(34px,11vw,80px)}
  .tag{letter-spacing:.4em;font-size:16px}
  .grid{grid-template-columns:repeat(2,1fr);gap:26px 12px}
  .gh{letter-spacing:.1em}
  .grp + .grp{margin-top:52px}
  .cap h3{font-size:17px;letter-spacing:.08em}
  .cap .p{font-size:17px}
  .cap{flex-direction:column;gap:2px}
  .filters{gap:20px}
  section{padding-block:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.seen:not(.force) #intro{display:none!important}
#intro{position:fixed;inset:0;z-index:9999;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;cursor:pointer;animation:iOut .5s ease 7s forwards}

#intro .headwrap{position:absolute;inset:0;clip-path:polygon(36.57% 5.89%,43.52% 1.26%,50.00% 0.00%,54.63% 2.95%,59.72% 8.42%,62.50% 12.63%,62.96% 19.36%,60.65% 24.41%,55.56% 27.78%,50.46% 31.99%,42.13% 32.41%,39.35% 27.78%,37.50% 19.36%);transform-origin:60% 17%;will-change:transform,opacity;backface-visibility:hidden}
#intro .shut{position:absolute;inset:0;background:#000;clip-path:polygon(41.20% 14.73%,43.29% 15.57%,45.83% 16.84%,47.13% 18.94%,46.85% 21.89%,45.83% 23.99%,43.98% 25.25%,42.36% 23.99%,41.67% 20.20%,40.74% 16.84%)}
#intro .load{width:min(40vw,200px);height:1px;background:#2a2825;overflow:hidden;animation:iIn .7s ease .2s both}
#intro .load i{display:block;height:100%;width:100%;background:#f3f1ec;transform-origin:left;transform:scaleX(0);animation:iBar 1.6s cubic-bezier(.3,.6,.3,1) forwards}
#intro.go{animation:iOut2 .55s ease 1.05s forwards}
#intro.go .stage{animation:none}
#intro.go .lunge{animation:iCam 1.6s cubic-bezier(.5,0,.3,1) forwards}
#intro.go .headwrap{animation:iHead 1.6s linear forwards}
#intro.go .shut{animation:iOpen .35s ease .38s forwards}
#intro.go .load{animation:iIn .3s ease reverse forwards}
#intro.go .load i{animation:none;transform:scaleX(1)}
#intro.gone{display:none}
@keyframes iIn{from{opacity:0;transform:scale(.96)}}
@keyframes iBreathe{50%{transform:scale(1.025)}}
@keyframes iBar{to{transform:scaleX(.85)}}
@keyframes iOpen{to{opacity:0}}
@keyframes iCam{0%{transform:scale(1)}100%{transform:scale(1.18)}}
@keyframes iHead{
  0%{transform:translate3d(0,0,0) rotate(0) scale(1);opacity:1;animation-timing-function:cubic-bezier(.45,0,.25,1)}
  30%{transform:translate3d(1.2%,1.6%,0) rotate(3deg) scale(1);opacity:1;animation-timing-function:cubic-bezier(.5,0,.8,.55)}
  66%{transform:translate3d(-3%,-2%,0) rotate(-3deg) scale(1.6);opacity:1;animation-timing-function:linear}
  100%{transform:translate3d(-6%,-4%,0) rotate(-4deg) scale(2.2);opacity:0}
}
@keyframes iOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes iOut2{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){html:not(.force) #intro{display:none}}

.intro{color:var(--muted);font-size:20px;letter-spacing:.04em;max-width:60ch}
.spin{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:56px;align-items:center;padding-block:40px 80px;border-top:1px solid var(--line)}
.reel{position:relative;aspect-ratio:8/9;background:#0f0f0e;border:1px solid #1d1c1a;overflow:hidden}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.reel .q{position:absolute;inset:0;display:grid;place-items:center;font:500 clamp(90px,18vw,170px)/1 var(--serif);color:#242220}
.reel.rolling img{filter:blur(1.5px) brightness(.85)}
.reel.hit{border-color:var(--fg)}
.side h2{margin:0 0 18px;font-size:clamp(30px,4vw,48px);letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 30px;padding:0;list-style:none}
.chips button{background:none;border:0;border-bottom:1px solid transparent;color:var(--dim);font:500 18px var(--serif);letter-spacing:.22em;text-transform:lowercase;padding:4px 0;cursor:pointer}
.chips button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.chips button:hover{color:var(--fg)}
.go{background:transparent;color:var(--fg);border:1px solid var(--fg);font:500 20px var(--serif);letter-spacing:.35em;text-transform:lowercase;padding:16px 44px;cursor:pointer;transition:background .2s,color .2s}
.go:hover:not(:disabled){background:var(--fg);color:#0a0a0a}
.go:disabled{opacity:.45;cursor:default}
.result{min-height:150px;margin-top:34px}
.result h3{margin:0;font:500 clamp(30px,4vw,46px)/1.05 var(--serif);letter-spacing:.06em;text-transform:uppercase}
.result .meta{margin:10px 0 18px;color:var(--muted);font-size:21px;letter-spacing:.04em}
.result a{display:inline-block;font-size:18px;letter-spacing:.3em;text-transform:lowercase;text-decoration:none;border-bottom:1px solid var(--muted);padding-bottom:4px}
.result a:hover{border-color:var(--fg)}
@media (max-width:820px){.spin{grid-template-columns:minmax(0,1fr);gap:30px;padding-block:28px 60px}.reel{max-width:420px}}
</style>

var CATS = ["Hoodie sets", "Track sets", "Beanies", "Essentials", "Hoodies"];
var cat = "all", last = null, busy = false;
var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var $ = function(id){ return document.getElementById(id) };
function money(n){ return n == null || n === "null" ? "" : "$" + n }
function pool(){ return P.filter(function(p){ return cat === "all" || p.cat === cat }) }
function chips(){
  var all = ["all"].concat(CATS);
  $("chips").innerHTML = all.map(function(c){
    return '<li><button type="button" data-c="' + c + '" aria-pressed="' + (c === cat) + '">' + c + '</button></li>';
  }).join("");
}
function show(p){ var i = $("rimg"); i.src = p.img; i.alt = p.name; i.hidden = false; $("q").hidden = true }
function land(p){
  last = p.id; busy = false; $("go").disabled = false; $("go").textContent = "spin again";
  $("reel").classList.remove("rolling"); $("reel").classList.add("hit");
  $("result").innerHTML = '<h3></h3><p class="meta"></p><a></a>';
  var r = $("result");
  r.querySelector("h3").textContent = p.name;
  r.querySelector(".meta").textContent = [money(p.price), p.note].filter(Boolean).join("  ·  ");
  var a = r.querySelector("a"); a.href = "index.html#item-" + p.id; a.textContent = "open this piece";
}
function spin(){
  if(busy) return;
  var L = pool(); if(!L.length) return;
  var cand = L.filter(function(p){ return p.id !== last }); if(!cand.length) cand = L;
  var target = cand[Math.floor(Math.random() * cand.length)];
  $("result").innerHTML = ""; $("reel").classList.remove("hit");
  if(reduce || L.length < 2){ show(target); land(target); return; }
  busy = true; $("go").disabled = true; $("go").textContent = "spinning"; $("reel").classList.add("rolling");
  var n = 20 + Math.floor(Math.random() * 6), seq = [], prev = null;
  for(var k = 0; k < n - 1; k++){
    var c; do { c = L[Math.floor(Math.random() * L.length)] } while(c === prev || c === target);
    seq.push(c); prev = c;
  }
  seq.push(target);
  var i = 0;
  (function step(){
    show(seq[i]);
    if(i === seq.length - 1){ land(target); return }
    var d = 55 + i * i * 0.85; i++;
